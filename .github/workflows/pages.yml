# Testa och publicera Command Hub på GitHub Pages.
# - Push till main   -> vanliga versionen:  https://maxorward-1990.github.io/stackchan-command-hub/
# - Push till preview -> testversionen:     https://maxorward-1990.github.io/stackchan-command-hub/preview/
# Den här workflowen testar (firmwaretesterna bara när firmware/, v61/ eller workflows ändrats).
# När testerna går igenom på main eller preview publicerar publish.yml båda versionerna.
name: Testa och publicera

on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10 kraschar på projektets beroenden; npm 11 fungerar.
      - run: npx -y npm@11 ci --no-audit --no-fund
      - name: Webbtester
        run: npm test
      - name: Ändrades firmware?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then range="origin/$BASE_REF...HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then range=""
          else range="$BEFORE..HEAD"; fi
          if [ -z "$range" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then fw=true
          elif git diff --name-only $range | grep -qE '^(firmware/|v61/|\.github/workflows/)'; then fw=true
          else fw=false; fi
          echo "firmware=$fw" >> "$GITHUB_OUTPUT"; echo "Firmwaretester behövs: $fw"
      - name: Firmwaretester
        if: steps.changes.outputs.firmware == 'true'
        run: bash firmware/run_tests.sh
