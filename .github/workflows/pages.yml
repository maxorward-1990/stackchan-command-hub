# Testa och publicera Command Hub på GitHub Pages.
# - Push till main   -> vanliga versionen:  https://maxorward-1990.github.io/stackchan-command-hub/
# - Push till preview -> testversionen:     https://maxorward-1990.github.io/stackchan-command-hub/preview/
# Varje publicering bygger båda (Pages har bara en sida), men testar bara det som ändrats:
# firmwaretesterna körs endast när firmware/, v61/ eller workflows ändrats.
name: Testa och publicera

on:
  push:
    branches: [main, preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10 kraschar på projektets beroenden; npm 11 fungerar.
      - run: npx -y npm@11 ci --no-audit --no-fund
      - name: Webbtester
        run: npm test
      - name: Ändrades firmware?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then range="origin/$BASE_REF...HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then range=""
          else range="$BEFORE..HEAD"; fi
          if [ -z "$range" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then fw=true
          elif git diff --name-only $range | grep -qE '^(firmware/|v61/|\.github/workflows/)'; then fw=true
          else fw=false; fi
          echo "firmware=$fw" >> "$GITHUB_OUTPUT"; echo "Firmwaretester behövs: $fw"
      - name: Firmwaretester
        if: steps.changes.outputs.firmware == 'true'
        run: bash firmware/run_tests.sh

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Finns preview-branchen?
        id: preview
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" preview >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Hämta preview
        if: steps.preview.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: preview
          path: preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Bygg vanliga versionen
        working-directory: main
        run: npx -y npm@11 ci --no-audit --no-fund && npm run build:pages
      - name: Bygg preview
        if: steps.preview.outputs.exists == 'true'
        working-directory: preview
        run: npx -y npm@11 ci --no-audit --no-fund && npm run build:preview
      - name: Sätt ihop sidan
        if: steps.preview.outputs.exists == 'true'
        run: node main/tools/assemble-pages.mjs main/dist/client preview/dist/client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: main/dist/client
      - id: deployment
        uses: actions/deploy-pages@v4
